<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Janus — optical datapath">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#10182A"/>
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="25%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="75%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#F5C14A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect x="48" y="36" width="1184" height="248" rx="28" fill="url(#glass)" stroke="#1E293B"/>

  <!-- five spectral channels -->
  <g filter="url(#glow)" transform="translate(72,86)">
    <rect width="8" height="148" rx="4" fill="#7C5CFF"/>
    <rect x="22" width="8" height="148" rx="4" fill="#3B82F6"/>
    <rect x="44" width="8" height="148" rx="4" fill="#22D3EE"/>
    <rect x="66" width="8" height="148" rx="4" fill="#34D399"/>
    <rect x="88" width="8" height="148" rx="4" fill="#F5C14A"/>
  </g>

  <text x="210" y="148" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial" font-size="64" font-weight="700" letter-spacing="2">JANUS</text>
  <text x="210" y="196" fill="#94A3B8" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial" font-size="22" letter-spacing="1.4">OPTICAL DATAPATH  ·  SPECTRAL STORAGE  ·  OPEN TOOLCHAINS</text>
  <rect x="210" y="216" width="420" height="4" rx="2" fill="url(#prism)"/>
  <text x="210" y="252" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial" font-size="16">@Janus5G  ·  Denmark</text>
</svg>
